services:
  - type: web
    name: sheds-pos-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DB_PATH
        value: /var/data/danzona_pos.db
    disk:
      name: sheds-data
      mountPath: /var/data
      sizeGB: 1
