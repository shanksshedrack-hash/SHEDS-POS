<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt - SHEDS POS</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="api.js"></script>
    <script src="common.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --surface: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-soft: #ecfdf5;
            --accent: #3b82f6;
            --success: #10b981;
            --success-soft: #ecfdf5;
            --warning: #f59e0b;
            --warning-soft: #fffbeb;
            --danger: #ef4444;
            --danger-soft: #fef2f2;
            --radius: 20px;
            --shadow: 0 1px 3px rgba(0,0,0,0.04), 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text);
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 880px;
            margin: 0 auto;
        }

        /* Top Bar */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .topbar-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(16,185,129,0.25);
        }

        .topbar-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .topbar-subtitle {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(16,185,129,0.2);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            box-shadow: 0 4px 12px rgba(16,185,129,0.3);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
            font-weight: 600;
        }

        .btn-success:hover {
            background: #059669;
            border-color: #059669;
        }

        .btn-ghost {
            background: transparent;
            border-color: transparent;
            color: var(--muted);
        }

        .btn-ghost:hover {
            background: #f1f5f9;
            color: var(--text);
        }

        .btn i {
            font-size: 12px;
        }

        /* Receipt Paper */
        .receipt {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            max-width: 100%;
            transition: all 0.3s ease;
        }

        .receipt.size-58mm { max-width: 58mm; }
        .receipt.size-80mm { max-width: 80mm; }
        .receipt.size-a4 { max-width: 210mm; }
        .receipt.size-letter { max-width: 216mm; }

        /* Receipt Header */
        .receipt-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #fff;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .receipt-header::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16,185,129,0.15) 0%, transparent 70%);
        }

        .receipt-header::after {
            content: '';
            position: absolute;
            bottom: -80px;
            left: -40px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, transparent 70%);
        }

        .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 16px rgba(16,185,129,0.3);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }

        .brand-text p {
            font-size: 13px;
            opacity: 0.7;
            font-weight: 500;
        }

        .business-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 16px;
            position: relative;
            z-index: 1;
            font-size: 12px;
            opacity: 0.9;
            font-weight: 500;
        }

        .business-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .business-meta i {
            font-size: 11px;
            opacity: 0.8;
        }

        /* Receipt Body */
        .receipt-body {
            padding: 28px;
        }

        .receipt.size-58mm .receipt-body,
        .receipt.size-80mm .receipt-body {
            padding: 10px 8px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary-soft);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            font-size: 12px;
        }

        /* Details Grid */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .detail-card {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            transition: all 0.2s ease;
        }

        .detail-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(16,185,129,0.08);
        }

        .detail-card .label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .detail-card .value {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.2px;
        }

        /* Customer Card */
        .customer-card {
            background: var(--success-soft);
            border: 1px solid #a7f3d0;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .customer-card i {
            color: var(--success);
            font-size: 20px;
        }

        .customer-card .name {
            font-weight: 700;
            font-size: 15px;
            color: #065f46;
        }

        .customer-card .sub {
            font-size: 12px;
            color: #047857;
            margin-top: 2px;
        }

        /* Items Table */
        .items-table {
            width: 100%;
            border-collapse: collapse;
        }

        .items-table th {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }

        .items-table td {
            padding: 12px 14px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            vertical-align: top;
        }

        .items-table tbody tr:last-child td {
            border-bottom: 2px solid var(--border);
        }

        .items-table tbody tr:hover {
            background: #f8fafc;
        }

        .items-table .col-name {
            font-weight: 600;
        }

        .items-table .col-name small {
            display: block;
            font-size: 11px;
            color: var(--muted);
            font-weight: 500;
            margin-top: 3px;
        }

        .items-table .col-price,
        .items-table .col-qty,
        .items-table .col-total {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 500;
        }

        .items-table .col-total {
            font-weight: 700;
            color: var(--text);
        }

        /* Summary Table */
        .summary-table {
            width: 100%;
            border-collapse: collapse;
        }

        .summary-table td {
            padding: 10px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 14px;
        }

        .summary-table td:last-child {
            text-align: right;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
        }

        .summary-table .grand-total td {
            padding: 14px 0;
            font-size: 18px;
            font-weight: 800;
            border-top: 2px solid var(--text);
            border-bottom: 2px solid var(--text);
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .summary-table .grand-total td:last-child {
            font-family: 'JetBrains Mono', monospace;
            color: var(--primary);
        }

        .summary-table .discount-row td:last-child {
            color: var(--success);
        }

        /* Payment Card */
        .payment-card {
            background: linear-gradient(135deg, #f0fdf4, #ecfdf5);
            border: 1px solid #a7f3d0;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .payment-card .method {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
        }

        .payment-card .method i {
            color: var(--primary);
            font-size: 18px;
        }

        .payment-card .amount {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
        }

        .change-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-soft);
            color: var(--primary-dark);
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 10px;
        }

        /* QR Section */
        .qr-section {
            text-align: center;
            padding: 24px 0;
            border-top: 1px dashed var(--border);
            margin-top: 24px;
        }

        .qr-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border: 2px solid var(--border);
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: var(--primary);
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .qr-text {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .stamp {
            display: inline-block;
            border: 2px dashed var(--success);
            color: var(--success);
            padding: 8px 22px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            transform: rotate(-3deg);
            opacity: 0.9;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(16,185,129,0.15);
        }

        /* Receipt Footer */
        .receipt-footer {
            background: linear-gradient(135deg, #f8fafc, #f1f5f9);
            border-top: 1px solid var(--border);
            padding: 24px;
            text-align: center;
        }

        .receipt-footer .thank {
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .receipt-footer .note {
            font-size: 13px;
            color: var(--muted);
            font-weight: 500;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .quick-actions .btn {
            flex: 1;
            min-width: 120px;
            justify-content: center;
        }

        /* Empty State */
        .empty {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }

        .empty i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
            opacity: 0.3;
        }

        .empty p {
            font-size: 15px;
            font-weight: 500;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-muted {
            background: #f1f5f9;
            color: var(--muted);
        }

        /* Pharmacist Verification */
        .pharmacist-verification {
            background: linear-gradient(135deg, #fef3c7, #fffbeb);
            border: 1px solid #fde68a;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pharmacist-verification i {
            color: var(--warning);
            font-size: 20px;
        }

        .pharmacist-verification .text {
            font-size: 13px;
            color: #92400e;
            font-weight: 600;
        }

        .pharmacist-verification .sub {
            font-size: 11px;
            color: #a16207;
            margin-top: 2px;
        }

        /* Print Styles */
        @media print {
            body {
                background: #fff;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .topbar {
                display: none !important;
            }

            .receipt {
                box-shadow: none;
                border-radius: 0;
                border: none;
                max-width: 100%;
            }

            .receipt-header {
                padding: 20px;
            }

            .receipt-body {
                padding: 20px;
            }

            .receipt-footer {
                padding: 16px;
            }

            .quick-actions {
                display: none !important;
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .receipt-body {
                padding: 18px;
            }

            .topbar {
                flex-direction: column;
                align-items: stretch;
            }

            .topbar-actions {
                justify-content: flex-end;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .items-table th,
            .items-table td {
                padding: 8px 6px;
                font-size: 12px;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }

            .business-meta {
                justify-content: center;
            }
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .receipt {
            animation: fadeInUp 0.5s ease-out;
        }

        .section {
            animation: fadeInUp 0.4s ease-out backwards;
        }

        .section:nth-child(1) { animation-delay: 0.1s; }
        .section:nth-child(2) { animation-delay: 0.15s; }
        .section:nth-child(3) { animation-delay: 0.2s; }
        .section:nth-child(4) { animation-delay: 0.25s; }
        .section:nth-child(5) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="topbar-left">
                <div class="topbar-icon"><i class="fas fa-receipt"></i></div>
                <div>
                    <div class="topbar-title">Receipt</div>
                    <div class="topbar-subtitle">Transaction summary</div>
                </div>
            </div>
            <div class="topbar-actions">
                <button class="btn" onclick="editCheckout()"><i class="fas fa-edit"></i> Edit</button>
                <button class="btn" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
                <button class="btn btn-success" onclick="goNewSale()"><i class="fas fa-plus"></i> New Sale</button>
            </div>
        </div>

        <div class="receipt" id="receiptPaper">
            <div class="receipt-header">
                <div class="header-content">
                    <div class="brand-icon"><i class="fas fa-clinic-medical"></i></div>
                    <div class="brand-text">
                        <h1 id="businessName">SHEDS POS</h1>
                        <p id="businessTagline">Professional Pharmacy Point of Sale</p>
                    </div>
                </div>
                <div class="business-meta">
                    <span><i class="fas fa-map-marker-alt"></i> <span id="businessLocation">Loading...</span></span>
                    <span><i class="fas fa-phone"></i> <span id="businessPhone">Loading...</span></span>
                    <span><i class="fas fa-envelope"></i> <span id="businessEmail">Loading...</span></span>
                </div>
            </div>

            <div class="receipt-body" id="receiptBody">
                <div class="empty">
                    <i class="fas fa-receipt"></i>
                    <p>Loading receipt...</p>
                </div>
            </div>

            <div class="receipt-footer" id="receiptFooter" style="display:none;">
                <div class="thank" id="footerThank">Thank You for Your Purchase!</div>
                <div class="note" id="footerNote">Please keep this receipt for your records</div>
            </div>
        </div>
    </div>

    <script>
        function fmt(n){try{return StoreConfig.formatCurrency(n);}catch(e){return '₦'+(parseFloat(n)||0).toLocaleString('en-NG',{minimumFractionDigits:2});}}
        function esc(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
        function noop(label){window.alert(label+' is available from the main POS interface.');}
        function go(p){window.location.href=p;}
        function goNewSale(){localStorage.removeItem('salesCart');localStorage.removeItem('last_receipt');go('sales.html');}
        function paymentLabel(method){var labels={cash:'Cash',store_account:'Store Account',bank_transfer:'Bank Transfer',suspended:'Suspended Sale',card:'Card',pos:'POS',giftcard:'Gift Card'};return labels[method]||(method||'Cash').replace(/_/g,' ');}
        function paymentIcon(method){var icons={cash:'fa-money-bill-wave',store_account:'fa-wallet',bank_transfer:'fa-university',suspended:'fa-pause-circle',card:'fa-credit-card',pos:'fa-cash-register',giftcard:'fa-gift'};return icons[method]||'fa-money-bill-wave';}
        function fmtDate(value){var d=value?new Date(value):new Date();if(isNaN(d.getTime()))d=new Date();return d.toLocaleString('en-US',{month:'2-digit',day:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});}
        function qty(n){return parseInt(n||0,10)||0;}

        function editCheckout(){
            var raw=localStorage.getItem('last_receipt');
            if(!raw){go('sales.html');return;}
            var r;
            try{r=JSON.parse(raw);}catch(e){go('sales.html');return;}
            var cartItems=r.items||[];
            if(cartItems.length){
                var restored=cartItems.map(function(it){
                    return{product_id:parseInt(it.product_id)||0,qty:qty(it.qty),discount:parseFloat(it.discount)||0,name:it.name,price:parseFloat(it.unit_price||it.price||0),pkgType:it.pkg_type||'pkt'};
                });
                localStorage.setItem('salesCart',JSON.stringify(restored));
            }
            go('sales.html');
        }

        function applyReceiptStyles(){
            var paper = document.getElementById('receiptPaper');
            if(!paper) return;
            var size = (StoreConfig.get('receiptPageSize') || '80mm').toLowerCase();
            paper.classList.remove('size-58mm', 'size-80mm', 'size-a4', 'size-letter');
            if(size === '58mm') paper.classList.add('size-58mm');
            else if(size === 'a4') paper.classList.add('size-a4');
            else if(size === 'letter') paper.classList.add('size-letter');
            else paper.classList.add('size-80mm');

            var fontSize = StoreConfig.get('receiptFontSize') || 12;
            var margin = StoreConfig.get('receiptMargin') || 10;
            var body = document.querySelector('.receipt-body');
            if(body){
                body.style.fontSize = fontSize + 'px';
                body.style.padding = margin + 'px';
            }
            var header = document.querySelector('.receipt-header');
            if(header){
                header.style.padding = (parseInt(margin) + 12) + 'px';
            }
        }

        function load(){
            applyReceiptStyles();
            var raw=localStorage.getItem('last_receipt');
            if(!raw){
                document.getElementById('receiptBody').innerHTML='<div class="empty"><i class="fas fa-receipt"></i><p>No checkout receipt found.<br>Complete a sale to view the receipt.</p></div>';
                return;
            }
            var r;
            try{r=JSON.parse(raw);}catch(e){
                document.getElementById('receiptBody').innerHTML='<div class="empty"><i class="fas fa-exclamation-circle"></i><p>Receipt data is invalid or corrupted.</p></div>';
                return;
            }

            var items=r.items||[];
            var subtotal=items.reduce(function(s,it){return s+(parseFloat(it.unit_price||it.price||0)*qty(it.qty));},0);
            var discount=items.reduce(function(s,it){return s+(parseFloat(it.discount)||0);},0);
            var tax=parseFloat(r.tax_amount||r.sales_tax||0)||0;
            var total=parseFloat(r.total)||Math.max(0,subtotal-discount+tax);
            var tendered=parseFloat(r.cash_received||r.amount_tendered||r.tendered)||total;
            var change=Math.max(0,tendered-total);
            var sold=items.reduce(function(s,it){return s+qty(it.qty);},0);

            var businessName=r.business_name||((window.API&&API.getPharmacyName)?API.getPharmacyName():'SHEDS POS');
            var businessAddress=r.business_address||StoreConfig.get('storeAddress')||'';
            var businessPhone=r.business_phone||StoreConfig.get('phoneNumber')||'';
            var businessEmail=r.business_email||StoreConfig.get('emailAddress')||'';
            var footerText=StoreConfig.get('footerText')||'Thank you for choosing SHEDS POS!';

            document.getElementById('businessName').textContent=businessName;
            document.getElementById('businessTagline').textContent=footerText;
            document.getElementById('businessLocation').textContent=businessAddress||'Address not set';
            document.getElementById('businessPhone').textContent=businessPhone||'Phone not set';
            document.getElementById('businessEmail').textContent=businessEmail||'Email not set';

            var html='';

            html+='<div class="section"><div class="section-title"><i class="fas fa-info-circle"></i> Transaction Details</div><div class="details-grid">';
            html+='<div class="detail-card"><div class="label">Receipt Type</div><div class="value">Sales Receipt</div></div>';
            html+='<div class="detail-card"><div class="label">Date & Time</div><div class="value">'+esc(fmtDate(r.created_at||r.date))+'</div></div>';
            html+='<div class="detail-card"><div class="label">Sale ID</div><div class="value">#'+esc(r.sale_id||r.id||'POS-')+'</div></div>';
            html+='<div class="detail-card"><div class="label">Cashier</div><div class="value">'+esc(r.employee||r.cashier||'Cashier')+'</div></div>';
            html+='</div></div>';

            if(r.customer_name){
                html+='<div class="section"><div class="section-title"><i class="fas fa-user"></i> Customer</div>';
                html+='<div class="customer-card"><i class="fas fa-user-circle"></i><div><div class="name">'+esc(r.customer_name)+'</div><div class="sub">Walk-in Customer</div></div></div>';
                html+='</div>';
            }

            html+='<div class="section"><div class="section-title"><i class="fas fa-shopping-bag"></i> Items Purchased ('+sold+')</div>';
            html+='<table class="items-table"><thead><tr><th style="width:45%">Item</th><th style="width:15%" class="col-price">Unit Price</th><th style="width:10%" class="col-qty">Qty</th><th style="width:15%" class="col-total">Total</th></tr></thead><tbody>';
            items.forEach(function(it){
                var itemTotal=(parseFloat(it.unit_price||it.price||0)*qty(it.qty))-(parseFloat(it.discount)||0);
                var pkgName='';
                if(it.pkg_type) pkgName='<small>Unit: '+esc(it.pkg_type.toUpperCase())+'</small>';
                html+='<tr><td class="col-name">'+esc(it.name||'Item')+pkgName+'<small>'+esc(it.sku||'')+'</small></td><td class="col-price">'+fmt(it.unit_price||it.price||0)+'</td><td class="col-qty">'+qty(it.qty)+'</td><td class="col-total">'+fmt(itemTotal)+'</td></tr>';
            });
            html+='</tbody></table></div>';

            html+='<div class="section"><div class="section-title"><i class="fas fa-calculator"></i> Sales Summary</div>';
            html+='<table class="summary-table"><tbody>';
            html+='<tr><td>Subtotal</td><td>'+fmt(subtotal)+'</td></tr>';
            if(discount>0){html+='<tr class="discount-row"><td>Discount</td><td>-'+fmt(discount)+'</td></tr>';}
            var taxPct=subtotal>0?(tax/subtotal*100).toFixed(1)+'%':'0.0%';
            html+='<tr><td>Tax (VAT)</td><td>'+fmt(tax)+' <span style="font-size:12px;color:var(--muted);font-weight:500;">('+taxPct+')</span></td></tr>';
            html+='<tr class="grand-total"><td>Total Amount</td><td>'+fmt(total)+'</td></tr>';
            html+='</tbody></table></div>';

            html+='<div class="section"><div class="section-title"><i class="fas fa-credit-card"></i> Payment</div>';
            html+='<div class="payment-card">';
            html+='<div class="method"><i class="fas '+paymentIcon(r.payment_method||r.payment_type)+'"></i> '+esc(paymentLabel(r.payment_method||r.payment_type))+'</div>';
            html+='<div class="amount">'+fmt(tendered)+'</div>';
            html+='</div>';
            if(change>0){
                html+='<div class="change-badge"><i class="fas fa-check-circle"></i> Change Due: <strong>'+fmt(change)+'</strong></div>';
            }
            html+='</div>';

            html+='<div class="pharmacist-verification"><i class="fas fa-user-md"></i><div><div class="text">Pharmacist Verification</div><div class="sub">Verified by: '+esc(r.employee||r.cashier||'System')+' | License: PHM-2024-001</div></div></div>';

            html+='<div class="qr-section">';
            html+='<div class="qr-box"><i class="fas fa-qrcode"></i></div>';
            html+='<div class="qr-text">SALE-'+esc((r.sale_id||r.id||'000000'))+'</div>';
            html+='<div class="stamp">PAID</div>';
            html+='</div>';

            html+='<div class="quick-actions">';
            html+='<button class="btn" onclick="editCheckout()"><i class="fas fa-edit"></i> Edit</button>';
            html+='<button class="btn" onclick="window.print()"><i class="fas fa-print"></i> Print</button>';
            html+='<button class="btn" onclick="goNewSale()"><i class="fas fa-plus"></i> New Sale</button>';
            html+='</div>';

            document.getElementById('receiptBody').innerHTML=html;
            document.getElementById('receiptFooter').style.display='block';
            document.getElementById('footerThank').textContent=footerText;
            document.getElementById('footerNote').textContent='Printed on: '+esc(new Date().toLocaleString())+' | Cashier: '+esc(r.employee||r.cashier||'Admin');
        }

        function saveAsPDF(){window.print();}

        document.addEventListener('DOMContentLoaded',load);
    </script>
</body>
</html>
